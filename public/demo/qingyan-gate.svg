<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400">
  <!-- 青岩北门城楼 · 平涂插画 -->
  <rect width="640" height="400" fill="#dfe9ec"/>
  <rect y="250" width="640" height="150" fill="#8fa3a8"/>
  <!-- 远山 -->
  <path d="M0 250 L140 130 L260 230 L400 110 L640 250 Z" fill="#7fa3ad"/>
  <path d="M0 250 L140 130 L260 230 L400 110 L640 250" fill="none" stroke="#5d828d" stroke-width="6"/>
  <!-- 城墙 -->
  <rect x="40" y="230" width="560" height="120" fill="#5f737b"/>
  <g fill="#51656c">
    <rect x="40" y="230" width="560" height="14"/>
    <rect x="60" y="214" width="28" height="16"/><rect x="120" y="214" width="28" height="16"/>
    <rect x="180" y="214" width="28" height="16"/><rect x="432" y="214" width="28" height="16"/>
    <rect x="492" y="214" width="28" height="16"/><rect x="552" y="214" width="28" height="16"/>
  </g>
  <!-- 城楼 -->
  <rect x="260" y="150" width="120" height="90" fill="#6b4f3a"/>
  <path d="M240 150 L320 96 L400 150 Z" fill="#33494f"/>
  <path d="M252 152 L320 106 L388 152" fill="none" stroke="#22383d" stroke-width="5"/>
  <rect x="296" y="182" width="48" height="58" rx="24" fill="#2b1f16"/>
  <!-- 城门洞 -->
  <rect x="140" y="262" width="76" height="88" rx="38" fill="#2e3f44"/>
  <rect x="424" y="262" width="76" height="88" rx="38" fill="#2e3f44"/>
  <!-- 石板路 -->
  <g stroke="#7c8f94" stroke-width="3">
    <path d="M0 300 H640 M0 340 H640 M0 380 H640"/>
    <path d="M80 300 V400 M200 300 V400 M320 300 V400 M440 300 V400 M560 300 V400"/>
  </g>
  <!-- 石狮子 -->
  <circle cx="240" cy="316" r="16" fill="#9db0b5"/>
  <circle cx="400" cy="316" r="16" fill="#9db0b5"/>
  <rect x="222" y="330" width="36" height="20" rx="6" fill="#9db0b5"/>
  <rect x="382" y="330" width="36" height="20" rx="6" fill="#9db0b5"/>
  <text x="320" y="380" text-anchor="middle" font-family="serif" font-size="22" fill="#f4ead3" letter-spacing="4">青岩古镇 · 北门城楼</text>
</svg>
