<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>黔行副导海报</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 793px; height: 1983px; overflow: hidden; }
      body {
        color: #fffaf0;
        font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
        background: #031021;
      }
      .poster {
        position: relative;
        width: 793px;
        height: 1983px;
        overflow: hidden;
        background: url("/posters/sources/v12-background.png") center / cover no-repeat;
      }
      .headline {
        position: absolute;
        top: 112px;
        width: 100%;
        text-align: center;
        letter-spacing: 4px;
        text-shadow: 0 4px 18px rgba(0, 0, 0, .42);
      }
      .headline h1 {
        margin: 0;
        font-family: "Songti SC", "STSong", serif;
        font-size: 76px;
        line-height: 1;
        font-weight: 800;
        color: #f8e7c7;
      }
      .headline p {
        margin: 24px 0 0;
        font-family: "Songti SC", "STSong", serif;
        font-size: 25px;
        letter-spacing: 2px;
        color: #f2dfbb;
      }
      .statement {
        position: absolute;
        top: 326px;
        left: 58px;
        right: 58px;
        padding: 20px 0 18px;
        text-align: center;
        border-top: 1px solid rgba(216, 174, 92, .58);
        border-bottom: 1px solid rgba(216, 174, 92, .35);
        font-family: "Songti SC", "STSong", serif;
        font-size: 23px;
        letter-spacing: 1px;
        color: #fbf4e6;
      }
      .screen-labels {
        position: absolute;
        top: 456px;
        left: 0;
        width: 100%;
        display: flex;
        justify-content: center;
        gap: 38px;
      }
      .screen-label {
        width: 206px;
        text-align: center;
        line-height: 1.45;
      }
      .screen-label b {
        display: block;
        color: #55eff2;
        font-size: 18px;
        font-weight: 700;
      }
      .screen-label span {
        display: block;
        margin-top: 5px;
        color: #e9eef1;
        font-size: 13px;
      }
      .phones {
        position: absolute;
        top: 548px;
        left: 48px;
        display: flex;
        align-items: flex-start;
        gap: 40px;
      }
      .phone {
        position: relative;
        width: 206px;
        height: 446px;
        padding: 9px 5px 11px;
        overflow: hidden;
        border: 2px solid #8296a9;
        border-radius: 31px;
        background: linear-gradient(145deg, #1a3045, #060d15 56%, #273b4d);
        box-shadow: 0 12px 30px rgba(0, 0, 0, .55), inset 0 0 0 1px rgba(255,255,255,.16);
      }
      .phone::before {
        content: "";
        position: absolute;
        z-index: 5;
        top: 4px;
        left: 50%;
        width: 65px;
        height: 13px;
        transform: translateX(-50%);
        border-radius: 0 0 10px 10px;
        background: #07111c;
      }
      .screen {
        position: relative;
        width: 196px;
        height: 426px;
        overflow: hidden;
        border-radius: 23px;
        background: #f6f2e8;
      }
      .screen > img.source {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .waterfall-hero {
        position: absolute;
        z-index: 2;
        top: 43px;
        left: 8px;
        width: 180px;
        height: 68px;
        overflow: hidden;
        border-radius: 17px 17px 0 0;
        background: #14313a;
      }
      .waterfall-hero img { width: 100%; height: 100%; object-fit: cover; }
      .waterfall-title {
        position: absolute;
        z-index: 3;
        top: 90px;
        left: 17px;
        color: #fff;
        font-size: 14px;
        font-weight: 800;
        letter-spacing: .3px;
        text-shadow: 0 2px 4px rgba(0,0,0,.85);
      }
      .result-strip {
        position: absolute;
        top: 1035px;
        left: 71px;
        width: 651px;
        display: flex;
        justify-content: space-between;
      }
      .result {
        width: 180px;
        text-align: center;
        color: #f1dcae;
      }
      .result i {
        display: block;
        width: 34px;
        height: 34px;
        margin: 0 auto 10px;
        border: 1.5px solid #50e7e9;
        border-radius: 50%;
        color: #58e9ec;
        font-style: normal;
        font-size: 21px;
        line-height: 31px;
        box-shadow: 0 0 15px rgba(61, 227, 230, .28);
      }
      .result span { font-size: 16px; font-weight: 650; letter-spacing: 1px; }
      .result::after {
        content: "";
        display: block;
        width: 1px;
        height: 34px;
        margin: 11px auto 0;
        background: linear-gradient(#42dce4, transparent);
      }
      .plaque-copy {
        position: absolute;
        top: 1654px;
        left: 50%;
        width: 420px;
        transform: translateX(-50%);
        text-align: center;
        color: #15243a;
        font-family: "Songti SC", "STSong", serif;
        font-size: 23px;
        font-weight: 800;
        letter-spacing: 1px;
        line-height: 1.25;
      }
    </style>
  </head>
  <body>
    <main class="poster">
      <header class="headline">
        <h1>黔行副导</h1>
        <p>阿黔——贵州文旅 AI 副导</p>
      </header>
      <div class="statement">让游客知道下一步，让导游看见漏掉的信号</div>
      <section class="screen-labels" aria-label="产品两端能力">
        <div class="screen-label"><b>游客端</b><span>集合、服务、求助一处看清</span></div>
        <div class="screen-label"><b>导游端</b><span>异常先接住，高频问题少打断</span></div>
        <div class="screen-label"><b>我的旅程</b><span>日程、导游、故事都留下</span></div>
      </section>
      <section class="phones" aria-label="真实产品界面">
        <article class="phone">
          <div class="screen">
            <img class="source" src="/posters/sources/visitor-home-mobile.png" alt="游客首页" />
            <div class="waterfall-hero"><img src="/posters/sources/huangguoshu-hero.png" alt="黄果树大瀑布" /></div>
            <div class="waterfall-title">黄果树大瀑布</div>
          </div>
        </article>
        <article class="phone">
          <div class="screen"><img class="source" src="/posters/sources/guide-data-mobile.png" alt="导游数据页" /></div>
        </article>
        <article class="phone">
          <div class="screen"><img class="source" src="/posters/sources/visitor-my-mobile.png" alt="我的旅程与故事卡" /></div>
        </article>
      </section>
      <section class="result-strip" aria-label="核心结果">
        <div class="result"><i>✓</i><span>集合信息同步</span></div>
        <div class="result"><i>!</i><span>异常信号直达</span></div>
        <div class="result"><i>✦</i><span>贵州故事沉淀</span></div>
      </section>
      <div class="plaque-copy">集合不漏 · 行程同步 · 异常直达导游</div>
    </main>
  </body>
</html>
